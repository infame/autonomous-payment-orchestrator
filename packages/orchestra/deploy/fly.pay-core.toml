app = "replace-me-apo-pay-core"
primary_region = "ord"

[build]
  dockerfile = "packages/pay-core/Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  PAYMENT_PROVIDER = "simulator"
  SIMULATOR_MODE = "deterministic"
  MIGRATE_ON_BOOT = "true"

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
