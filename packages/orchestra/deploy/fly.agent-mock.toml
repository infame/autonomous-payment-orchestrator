app = "replace-me-apo-agent-mock"
primary_region = "ord"

[build]
  dockerfile = "packages/agent-orchestrator/Dockerfile"

[env]
  PORT = "3200"
  HOST = "0.0.0.0"
  LLM_MODE = "mock"
  DURABLE_LEDGER_URL = "http://replace-me-apo-durable-ledger.flycast:3100"
  PAYMENT_METHOD_TOKEN = "sim.fail_then_succeed.1"
  MIGRATE_ON_BOOT = "true"

[http_service]
  internal_port = 3200
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
